<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login — Hermes Admin</title>
<script>
  (() => {
    try {
      const saved = localStorage.getItem('hermes-theme');
      const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = saved || preferred;
    } catch (_) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0b0e14; --slate:#12151d; --slate-2:#191d28; --hairline:#262b3b;
    --text:#e7e4da; --text-dim:#8991a6;
    --gold:#e3a53d; --gold-2:#f0c37a; --gold-wash:rgba(227,165,61,.12);
    --coral:#e2685f; --amber:#d9a441;
    --font-display:'Space Grotesk', sans-serif; --font-sans:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink:#f5f3ee; --slate:#ffffff; --slate-2:#f0ede4; --hairline:#ddd6c4;
    --text:#262218; --text-dim:#736c5c;
    --gold:#b57a1e; --gold-2:#8f5f14; --gold-wash:rgba(181,122,30,.10);
    --coral:#c34a41; --amber:#96691b;
    color-scheme: light;
  }
  * , *::before, *::after { box-sizing:border-box; }
  .icon {
    font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal;
    font-size:20px; line-height:1; display:inline-block; vertical-align:middle;
    -webkit-font-smoothing:antialiased;
  }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(circle at 50% -20%, var(--gold-wash), transparent 45%),
      var(--ink);
    color:var(--text); font-family:var(--font-sans);
  }
  .login-card {
    width:min(400px,100%); padding:30px; background:var(--slate);
    border:1px solid var(--hairline); border-radius:16px;
    box-shadow:0 24px 80px rgba(0,0,0,.35);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brand-icon {
    width:36px; height:36px; display:grid; place-items:center; border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    box-shadow:0 3px 10px var(--gold-wash);
  }
  .brand-icon .icon { color:#1a1206; font-variation-settings:'FILL' 1; }
  .brand-name { font-family:var(--font-display); font-weight:600; font-size:15px; }
  .brand-name span { color:var(--text-dim); font-weight:400; }
  h1 { margin:0 0 7px; font-family:var(--font-display); font-size:21px; font-weight:600; }
  .subtitle { margin:0 0 24px; color:var(--text-dim); font-size:13px; line-height:1.5; }
  label {
    display:block; margin:0 0 6px; color:var(--text-dim);
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.07em;
  }
  .field { position:relative; margin-bottom:16px; }
  .field .icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-dim); }
  input {
    width:100%; padding:10px 12px 10px 38px; border-radius:9px;
    border:1px solid var(--hairline); outline:none; background:var(--ink);
    color:var(--text); font:13px var(--font-sans);
  }
  input:focus { border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash); }
  button {
    width:100%; padding:11px; border:1px solid var(--gold); border-radius:9px;
    background:var(--gold); color:#1a1206; cursor:pointer;
    font:600 13px var(--font-sans); display:flex; align-items:center; justify-content:center; gap:7px;
  }
  button:hover { background:var(--gold-2); border-color:var(--gold-2); }
  .error {
    margin:0 0 16px; padding:10px 12px; border:1px solid var(--coral);
    border-radius:9px; color:var(--coral); background:rgba(226,104,95,.08);
    font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .notice {
    margin:0 0 16px; padding:10px 12px; border:1px solid var(--amber);
    border-radius:9px; color:var(--amber); background:rgba(217,164,65,.08);
    font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .footer {
    margin-top:20px; text-align:center; color:var(--text-dim);
    font:11px var(--font-mono);
  }
</style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <div class="brand-icon"><span class="icon">bolt</span></div>
      <div class="brand-name">hermes<span>/admin</span></div>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Login to configure and monitor your Hermes Agent.</p>

    {% if error %}
    <div class="error" role="alert"><span class="icon sm">error</span>{{ error }}</div>
    {% endif %}
    {% if notice %}
    <div class="notice" role="status"><span class="icon sm">info</span>{{ notice }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="username">Username</label>
      <div class="field">
        <span class="icon">person</span>
        <input id="username" name="username" type="text" autocomplete="username"
               required autofocus>
      </div>

      <label for="password">Password</label>
      <div class="field">
        <span class="icon">lock</span>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit"><span class="icon sm">login</span>Login</button>
    </form>
    <div class="footer">Protected Hermes administration</div>
  </main>
</body>
</html>
